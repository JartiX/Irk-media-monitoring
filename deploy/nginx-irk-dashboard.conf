# nginx обратный прокси для Streamlit-дашборда.
# Установка:
#   sudo cp deploy/nginx-irk-dashboard.conf /etc/nginx/sites-available/irk-dashboard
#   sudo ln -s /etc/nginx/sites-available/irk-dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (Let's Encrypt): sudo certbot --nginx -d dashboard.example.com
#   (certbot сам добавит listen 443 + сертификаты + редирект с 80).
# Заменить dashboard.example.com на свой домен.

server {
    listen 80;
    server_name dashboard.example.com;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit использует WebSocket — обязательно проксировать upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
